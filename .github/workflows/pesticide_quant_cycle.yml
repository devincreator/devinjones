name: pesticide-quant-cycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'pesticide_quant/**'
      - '.github/workflows/pesticide_quant_cycle.yml'

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pesticide_quant/requirements.txt
      - name: Install
        run: pip install -r pesticide_quant/requirements.txt
      - name: Bootstrap
        run: |
          mkdir -p work logs
          python pesticide_quant/bootstrap_db.py --db work/pesticide.sqlite
      - name: Fetch official NBS glyphosate cycle
        id: cycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/industry_cycle_nbs.py \
            --db work/pesticide.sqlite \
            --start 2020-06-01 \
            --audit-json work/industry_cycle_nbs_audit.json \
            2>&1 | tee logs/industry_cycle_nbs.log
      - name: Status
        if: always()
        run: |
          python - <<'PY'
          import sqlite3,json,pathlib
          con=sqlite3.connect('work/pesticide.sqlite')
          rows=con.execute('select count(*) from industry_product_daily').fetchone()[0]
          mn,mx=con.execute('select min(date),max(date) from industry_product_daily').fetchone()
          con.close()
          d={'cycle_step':'${{ steps.cycle.outcome }}','rows':rows,'min':mn,'max':mx}
          p=pathlib.Path('work/industry_cycle_nbs_audit.json')
          if p.exists():d['audit']=json.loads(p.read_text(encoding='utf-8'))
          pathlib.Path('work/cycle_status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesticide-quant-cycle-${{ github.run_number }}
          path: |
            work/**
            logs/**
          retention-days: 30

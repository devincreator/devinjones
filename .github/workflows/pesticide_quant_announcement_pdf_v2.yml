name: pesticide-quant-announcement-pdf-v2

on:
  push:
    branches: [pesticide-v2-pdf-fallback]
    paths:
      - 'pesticide_quant/announcement_fulltext_pdf_v2.py'
      - 'pesticide_quant/announcement_fulltext_v2_guard.py'
      - 'pesticide_quant/backtest_announcement_v2.py'
      - '.github/workflows/pesticide_quant_announcement_pdf_v2.yml'
  pull_request:
    branches: [pesticide-quant-run]
    paths:
      - 'pesticide_quant/announcement_fulltext_pdf_v2.py'
      - 'pesticide_quant/announcement_fulltext_v2_guard.py'
      - 'pesticide_quant/backtest_announcement_v2.py'
      - '.github/workflows/pesticide_quant_announcement_pdf_v2.yml'

permissions:
  contents: read
  actions: read

jobs:
  pdf-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pesticide_quant/requirements.txt

      - name: Install Python and poppler
        run: |
          python -m pip install --upgrade pip
          pip install -r pesticide_quant/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download frozen V1 research database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior work/pdf_v2 logs
          gh run download 32440213590 -n pesticide-quant-announcement-1 -D prior
          test -f prior/work/pesticide.sqlite
          cp prior/work/pesticide.sqlite work.sqlite

      - name: Rebuild audited title V1.1 baseline
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_rebuild_v1_1.py \
            --db work.sqlite --max-gap-days 15 \
            --audit-json work/pdf_v2/title_v1_1_audit.json \
            2>&1 | tee logs/title_v1_1.log

      - name: Fetch direct PDF full text and build V2
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_fulltext_pdf_v2.py \
            --db work.sqlite --workers 12 \
            --audit-json work/pdf_v2/pdf_v2_audit.json \
            --manifest-csv work/pdf_v2/pdf_fetch_manifest.csv \
            2>&1 | tee logs/pdf_v2.log

      - name: Apply deterministic semantic guards
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_fulltext_v2_guard.py \
            --db work.sqlite \
            --audit-json work/pdf_v2/pdf_v2_guard_audit.json \
            2>&1 | tee logs/pdf_v2_guard.log

      - name: Export event-chain evidence
        run: |
          python - <<'PY'
          import sqlite3,pandas as pd
          con=sqlite3.connect('work.sqlite')
          ev=pd.read_sql_query('SELECT * FROM announcement_event_v2 ORDER BY canonical_code,effective_date,art_code',con)
          ev.to_csv('work/pdf_v2/announcement_events_pdf_v2_guarded.csv',index=False,encoding='utf-8-sig')
          sample=ev[(ev.long_setup_flag>0)|(ev.recent_acceleration_event>0)|(ev.negative_acceleration_event>0)].copy()
          sample=sample.sort_values(['recent_acceleration_event','negative_acceleration_event','hardness_v2'],ascending=False).head(1000)
          sample.to_csv('work/pdf_v2/event_chain_high_information_sample.csv',index=False,encoding='utf-8-sig')
          con.close()
          PY

      - name: Run PDF V2 PIT walk-forward
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/backtest_announcement_v2.py \
            --db work.sqlite --outdir work/pdf_v2/backtest \
            2>&1 | tee logs/backtest_pdf_v2.log

      - name: Build report
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('work/pdf_v2')
          def j(p):
              q=root/p
              return json.loads(q.read_text(encoding='utf-8')) if q.exists() else {}
          a=j('pdf_v2_audit.json'); g=j('pdf_v2_guard_audit.json'); s=j('backtest/summary_v2.json')
          lines=['# 农药公告全文 PDF V2 执行报告','',
                 f"- PDF候选：{a.get('candidate_rows')}",
                 f"- PDF正文成功：{a.get('pdf_ok')} / 失败：{a.get('pdf_failed')}",
                 f"- PDF正文覆盖率：{a.get('pdf_text_coverage')}",
                 f"- stage变化事件：{a.get('events_with_stage_delta')}",
                 f"- 有进度百分比事件：{a.get('events_with_progress')}",
                 f"- 长期布局事件：{a.get('long_setup_events')}",
                 f"- 正向加速事件：{a.get('positive_acceleration_events')}",
                 f"- 负向加速事件：{a.get('negative_acceleration_events')}",
                 f"- 语义守卫修正：{g.get('changed_from_unguarded')}",'']
          if s.get('incremental_delta'):
              lines += ['## OOS增量','']
              for r in s['incremental_delta']:
                  lines.append(f"- {r.get('comparison')}: precision {r.get('precision_base')} -> {r.get('precision_new')} (Δ {r.get('precision_delta')}), AUC {r.get('auc_base')} -> {r.get('auc_new')} (Δ {r.get('auc_delta')})")
          lines += ['','## 质量门槛','','PDF正文覆盖率低于70%时，全文V2自动判为数据不合格，不解读回测成绩。']
          (root/'执行报告_pdf_v2.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesticide-quant-announcement-pdf-v2-${{ github.run_number }}
          path: |
            work/pdf_v2/**
            logs/**
          retention-days: 30

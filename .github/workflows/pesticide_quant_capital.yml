name: pesticide-quant-capital

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'pesticide_quant/**'
      - '.github/workflows/pesticide_quant_capital.yml'

permissions:
  contents: read

jobs:
  capital:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pesticide_quant/requirements.txt
      - name: Install
        run: pip install -r pesticide_quant/requirements.txt
      - name: Bootstrap membership and universe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work logs
          python pesticide_quant/bootstrap_db.py --db work/pesticide.sqlite 2>&1 | tee logs/bootstrap.log
          python pesticide_quant/membership_official_v2.py --db work/pesticide.sqlite --audit-csv work/membership_audit.csv --export-csv work/pesticide_membership_history.csv 2>&1 | tee logs/membership.log
          python pesticide_quant/export_universe.py --db work/pesticide.sqlite --out work/universe.csv 2>&1 | tee logs/universe.log
      - name: Fetch margin financing history
        id: margin
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/capital_margin.py --db work/pesticide.sqlite --universe-csv work/universe.csv 2>&1 | tee logs/capital_margin.log
      - name: Status
        if: always()
        run: |
          python - <<'PY'
          import sqlite3,json,pathlib
          con=sqlite3.connect('work/pesticide.sqlite')
          rows=con.execute('select count(*) from capital_flow_daily').fetchone()[0]
          codes=con.execute('select count(distinct code) from capital_flow_daily').fetchone()[0]
          mn,mx=con.execute('select min(trade_date),max(trade_date) from capital_flow_daily').fetchone()
          coverage=con.execute('select code,count(*),min(trade_date),max(trade_date) from capital_flow_daily group by code order by code').fetchall()
          con.close()
          d={'margin_step':'${{ steps.margin.outcome }}','rows':rows,'codes':codes,'min':mn,'max':mx,'coverage':coverage}
          pathlib.Path('work/capital_status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesticide-quant-capital-${{ github.run_number }}
          path: |
            work/**
            logs/**
          retention-days: 30

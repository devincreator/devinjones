name: pesticide-quant-announcement-v1-1-replay

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'pesticide_quant/announcement_rebuild_v1_1.py'
      - '.github/workflows/pesticide_quant_announcement_v1_1_replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay-v1-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pesticide_quant/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r pesticide_quant/requirements.txt

      - name: Download frozen original V1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior work/v1_1 logs
          gh run download 32440213590 -n pesticide-quant-announcement-1 -D prior
          test -f prior/work/pesticide.sqlite
          cp prior/work/pesticide.sqlite work.sqlite

      - name: Rebuild corrected title V1.1
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_rebuild_v1_1.py \
            --db work.sqlite --max-gap-days 15 \
            --audit-json work/v1_1/announcement_v1_1_audit.json \
            2>&1 | tee logs/announcement_v1_1.log

      - name: Run V1.1 incremental walk-forward
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/backtest_announcement.py \
            --db work.sqlite --outdir work/v1_1/backtest \
            --allow-partial \
            2>&1 | tee logs/backtest_v1_1.log

      - name: Build status
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          d={}
          for rel in ['announcement_v1_1_audit.json','backtest/backtest_announcement_summary.json','backtest/gate_announcement.json']:
              p=pathlib.Path('work/v1_1')/rel
              if p.exists():d[rel]=json.loads(p.read_text(encoding='utf-8'))
          pathlib.Path('work/v1_1/status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesticide-quant-announcement-v1-1-replay-${{ github.run_number }}
          path: |
            work/v1_1/**
            logs/**
          retention-days: 30

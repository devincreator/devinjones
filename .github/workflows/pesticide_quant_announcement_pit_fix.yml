name: pesticide-quant-announcement-pit-fix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'pesticide_quant/announcement_pit_realign.py'
      - '.github/workflows/pesticide_quant_announcement_pit_fix.yml'

permissions:
  contents: read

jobs:
  announcement-pit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pesticide_quant/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r pesticide_quant/requirements.txt

      - name: Bootstrap PIT membership and universe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work logs astock_data
          python pesticide_quant/bootstrap_db.py --db work/pesticide.sqlite 2>&1 | tee logs/bootstrap.log
          python pesticide_quant/membership_official_v2.py \
            --db work/pesticide.sqlite \
            --audit-csv work/membership_audit.csv \
            --export-csv work/pesticide_membership_history.csv \
            2>&1 | tee logs/membership.log
          python pesticide_quant/export_universe.py \
            --db work/pesticide.sqlite --out work/universe.csv \
            2>&1 | tee logs/universe.log

      - name: Build audited market history
        shell: bash
        run: |
          set -o pipefail
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet; do
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/newbiestring-lang/astock/main/$f" \
              -o "astock_data/$f"
          done
          python pesticide_quant/fallback_data.py \
            --db work/pesticide.sqlite --universe-csv work/universe.csv \
            --mode market --data-dir astock_data \
            2>&1 | tee logs/market_astock.log
          python pesticide_quant/sina_gap_fill.py --db work/pesticide.sqlite \
            2>&1 | tee logs/market_sina_gapfill.log
          python pesticide_quant/market_coverage_audit_v2.py \
            --db work/pesticide.sqlite \
            --out-csv work/market_interval_coverage.csv \
            --out-json work/market_interval_coverage.json \
            2>&1 | tee logs/market_interval_coverage.log

      - name: Fetch title-level announcement history
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_intelligence.py \
            --db work/pesticide.sqlite --universe-csv work/universe.csv \
            --start 2019-06-01 \
            --audit-json work/announcement_audit_pre_fix.json \
            --event-csv work/announcement_events_pre_fix.csv \
            2>&1 | tee logs/announcement_intelligence.log

      - name: Repair PIT event timing and rebuild features
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/announcement_pit_realign.py \
            --db work/pesticide.sqlite \
            --max-gap-days 15 \
            --audit-json work/announcement_pit_realign_audit.json \
            2>&1 | tee logs/announcement_pit_realign.log
          python - <<'PY'
          import pandas as pd, sqlite3
          con=sqlite3.connect('work/pesticide.sqlite')
          e=pd.read_sql_query('select * from announcement_event order by canonical_code,notice_date,art_code',con)
          e.to_csv('work/announcement_events_corrected.csv',index=False,encoding='utf-8-sig')
          con.close()
          PY

      - name: Fetch conservative PIT financials
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/live_data.py \
            --db work/pesticide.sqlite --universe-csv work/universe.csv --finance-only \
            2>&1 | tee logs/finance_live.log

      - name: Run corrected announcement incremental walk-forward
        shell: bash
        run: |
          set -o pipefail
          python pesticide_quant/backtest_announcement.py \
            --db work/pesticide.sqlite \
            --outdir work/backtest_announcement_corrected \
            --allow-partial \
            2>&1 | tee logs/backtest_announcement_corrected.log

      - name: Summarize corrected test
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sqlite3
          con=sqlite3.connect('work/pesticide.sqlite')
          counts={}
          for t in ['industry_membership_history','market_daily','financial_quarterly','announcement_raw','announcement_event','announcement_feature_daily']:
              try: counts[t]=con.execute(f'select count(*) from {t}').fetchone()[0]
              except Exception: counts[t]=None
          con.close()
          d={'counts':counts}
          for rel in ['announcement_pit_realign_audit.json','market_interval_coverage.json','backtest_announcement_corrected/gate_announcement.json','backtest_announcement_corrected/backtest_announcement_summary.json']:
              p=pathlib.Path('work')/rel
              if p.exists():
                  d[rel]=json.loads(p.read_text(encoding='utf-8'))
          pathlib.Path('work/announcement_pit_fix_status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pesticide-quant-announcement-pit-fix-${{ github.run_number }}
          path: |
            work/**
            logs/**
          retention-days: 30
